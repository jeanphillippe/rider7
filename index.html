<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cargando…</title>
  <meta name="description" content="">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/app.css">
  <script>
    /* Evita el parpadeo: aplica el modo guardado antes de pintar */
    try { var m = localStorage.getItem('r7-modo'); if (m) document.documentElement.dataset.theme = m; } catch (e) {}
  </script>
</head>
<body>
  <div class="bg-blur" aria-hidden="true"><img alt=""></div>

  <header class="site-header" id="arriba">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="Inicio">
        <img class="brand-logo" alt="">
        <span class="brand-text"></span>
      </a>
      <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" aria-label="Menú principal">
        <ul class="nav-list"></ul>
      </nav>
      <button class="theme-toggle" aria-label="Cambiar modo claro u oscuro" title="Claro / oscuro">
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- Inicio: listado de portadas -->
    <section class="view view-home" hidden>
      <div class="intro"></div>
      <div class="covers"></div>
    </section>

    <!-- Libro -->
    <section class="view view-book" hidden>
      <div class="book-bar">
        <a class="btn-ghost book-back" href="#/" aria-label="Volver al inicio">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>Inicio</span>
        </a>
        <h1 class="book-title"></h1>
        <div class="book-tools">
          <button class="btn-ghost tool-zoom" aria-label="Ampliar página" title="Ampliar">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5M11 8v6M8 11h6"/></svg>
          </button>
          <button class="btn-ghost tool-full" aria-label="Pantalla completa" title="Pantalla completa">
            <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>
      </div>
      <div class="book-stage">
        <button class="book-arrow prev" aria-label="Página anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="book-holder"></div>
        <button class="book-arrow next" aria-label="Página siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="book-foot">
        <input class="book-range" type="range" min="0" max="0" value="0" aria-label="Ir a página">
        <span class="book-count"></span>
      </div>
    </section>

    <!-- Mensajes (carga / error) -->
    <section class="view view-msg" hidden><div class="msg"></div></section>
  </main>

  <footer class="site-footer" id="contacto"></footer>

  <div class="zoom" hidden>
    <button class="zoom-close" aria-label="Cerrar">×</button>
    <div class="zoom-scroll"></div>
  </div>

  <script src="assets/vendor/page-flip.browser.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
